<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sinel: A Signal TLS Proxy - {{HOST}}</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛡️</text></svg>">
  <style>
    :root {
      --bg: #0a0a0a;
      --surface: #141414;
      --border: #262626;
      --border-hover: #404040;
      --text: #f5f5f5;
      --text-muted: #888888;
      --accent: #2c6bed;
      --accent-hover: #1d4ed8;
      --font-sans: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: var(--font-sans);
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 32px 24px;
      -webkit-font-smoothing: antialiased;
    }
    header {
      width: 100%;
      max-width: 580px;
      margin: 0 auto;
      display: flex;
      justify-content: flex-end;
      align-items: center;
    }
    .lang-switch {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.05em;
    }
    .lang-switch button {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-family: inherit;
      font-size: 13px;
      padding: 2px 4px;
      transition: color 0.15s ease;
    }
    .lang-switch button:hover {
      color: var(--text);
    }
    .lang-switch button.active {
      color: var(--text);
      font-weight: 700;
    }
    .lang-switch .divider {
      color: var(--border-hover);
      user-select: none;
    }
    main {
      width: 100%;
      max-width: 580px;
      margin: auto;
    }
    .title-group {
      margin-bottom: 28px;
    }
    h1 {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.04em;
      line-height: 1.15;
      color: var(--text);
      margin-bottom: 8px;
    }
    .subtitle {
      font-size: 14px;
      color: var(--text-muted);
      line-height: 1.5;
    }
    .card {
      border: 1px solid var(--border);
      background: var(--surface);
      border-radius: 4px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .input-wrap {
      display: flex;
      border: 1px solid var(--border);
      border-radius: 2px;
      background: var(--bg);
      transition: border-color 0.15s ease;
    }
    .input-wrap:focus-within {
      border-color: var(--border-hover);
    }
    .input-wrap input {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text);
      font-family: var(--font-mono);
      font-size: 13px;
      padding: 12px 14px;
      outline: none;
      min-width: 0;
    }
    .btn-copy {
      background: transparent;
      border: none;
      border-left: 1px solid var(--border);
      color: var(--text);
      font-family: var(--font-sans);
      font-size: 13px;
      font-weight: 600;
      padding: 0 18px;
      cursor: pointer;
      transition: background-color 0.15s ease, color 0.15s ease;
      white-space: nowrap;
    }
    .btn-copy:hover {
      background: #1f1f1f;
    }
    .btn-copy.copied {
      background: var(--accent);
      color: #fff;
    }
    .btn-primary {
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--accent);
      color: #ffffff;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      padding: 12px 20px;
      border-radius: 2px;
      transition: background-color 0.15s ease;
      letter-spacing: -0.01em;
    }
    .btn-primary:hover {
      background: var(--accent-hover);
    }
    .info {
      border-top: 1px solid var(--border);
      margin-top: 8px;
      padding-top: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.6;
    }
    .info-label {
      color: var(--text);
      font-weight: 600;
    }
    .mono-meta {
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--text-muted);
      background: #111;
      padding: 6px 10px;
      border-radius: 2px;
      border: 1px solid #1f1f1f;
      display: inline-block;
      margin-top: 4px;
    }
    footer {
      width: 100%;
      max-width: 580px;
      margin: 0 auto;
      font-size: 12px;
      color: #555555;
      letter-spacing: -0.01em;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 24px;
    }
  </style>
</head>
<body>
  <header>
    <nav class="lang-switch" aria-label="Language Switcher">
      <button id="btn-en" type="button" onclick="setLanguage('en')">EN</button>
      <span class="divider">/</span>
      <button id="btn-zh" type="button" class="active" onclick="setLanguage('zh')">中文</button>
    </nav>
  </header>

  <main>
    <div class="title-group">
      <h1>Sinel: A Signal TLS Proxy</h1>
      <p class="subtitle" id="subtitle"
         data-en="End-to-end encrypted relay for Signal censorship circumvention."
         data-zh="端到端加密的 Signal 抗审查专属代理通道。">
        端到端加密的 Signal 抗审查专属代理通道。
      </p>
    </div>

    <div class="card">
      <div class="input-wrap">
        <input type="text" id="shareUrl" value="{{SHARE_URL}}" readonly spellcheck="false">
        <button class="btn-copy" id="copyBtn" type="button" onclick="copyProxyUrl()">
          <span id="copyBtnText" data-en="Copy" data-zh="复制">复制</span>
        </button>
      </div>

      <a href="{{SHARE_URL}}" class="btn-primary" id="openBtn" target="_blank" rel="noopener noreferrer"
         data-en="Connect to Signal"
         data-zh="一键连接 Signal">
        一键连接 Signal
      </a>

      <div class="info">
        <div>
          <span class="info-label" id="guideLabel" data-en="Manual Setup:" data-zh="手动配置：">手动配置：</span>
          <span id="guideText"
                data-en="In Signal App, go to Settings &gt; Data and storage &gt; Use proxy."
                data-zh="在 Signal 中打开 设置 &gt; 数据与存储 &gt; 使用代理。">
            在 Signal 中打开 设置 &gt; 数据与存储 &gt; 使用代理。
          </span>
        </div>
        <div>
          <span class="mono-meta">{{HOST}}:443</span>
        </div>
      </div>
    </div>
  </main>

  <footer>
    <span>Sinel</span>
    <span>{{HOST}}</span>
  </footer>

  <script>
    let currentLang = 'zh';

    function setLanguage(lang) {
      currentLang = lang;
      document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';

      document.querySelectorAll('[data-en]').forEach(el => {
        el.textContent = el.getAttribute('data-' + lang);
      });

      document.getElementById('btn-en').classList.toggle('active', lang === 'en');
      document.getElementById('btn-zh').classList.toggle('active', lang === 'zh');

      try {
        localStorage.setItem('sinel_lang', lang);
      } catch (e) {}
    }

    function copyProxyUrl() {
      const input = document.getElementById('shareUrl');
      input.select();
      navigator.clipboard.writeText(input.value).then(() => {
        const textSpan = document.getElementById('copyBtnText');
        const originalText = textSpan.textContent;
        textSpan.textContent = currentLang === 'zh' ? '已复制' : 'Copied';
        document.getElementById('copyBtn').classList.add('copied');

        setTimeout(() => {
          textSpan.textContent = originalText;
          document.getElementById('copyBtn').classList.remove('copied');
        }, 1500);
      });
    }

    (function initLang() {
      try {
        const saved = localStorage.getItem('sinel_lang');
        if (saved && (saved === 'en' || saved === 'zh')) {
          setLanguage(saved);
          return;
        }
      } catch (e) {}

      const userLang = (navigator.language || navigator.userLanguage || '').toLowerCase();
      if (!userLang.startsWith('zh')) {
        setLanguage('en');
      }
    })();
  </script>
</body>
</html>
