<!DOCTYPE html>
<html lang="en-US">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sinel: A Signal TLS Proxy - {{HOST}}</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🖇️</text></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="header-actions">
      <a href="https://github.com/Obein/Sinel" target="_blank" rel="noopener noreferrer" class="github-link" aria-label="GitHub Repository" title="GitHub">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path fill-rule="evenodd" clip-rule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"/>
        </svg>
      </a>
      <nav class="lang-switch" aria-label="Language Switcher">
        <button id="btn-en" type="button" class="active" onclick="setLanguage('en')">EN</button>
        <span class="divider">/</span>
        <button id="btn-zh" type="button" onclick="setLanguage('zh')">中文</button>
      </nav>
    </div>
  </header>

  <main>
    <div class="title-group">
      <h1>Sinel: A Signal TLS Proxy</h1>
      <p class="subtitle" id="subtitle"
         data-en="End-to-end encrypted relay for Signal censorship circumvention."
         data-zh="端到端加密的 Signal 抗审查专属代理通道。">
        End-to-end encrypted relay for Signal censorship circumvention.
      </p>
    </div>

    <div class="card">
      <div class="input-wrap">
        <input type="text" id="shareUrl" value="{{SHARE_URL}}" readonly spellcheck="false">
        <button class="btn-copy" id="copyBtn" type="button" onclick="copyProxyUrl()">
          <span id="copyBtnText" data-en="Copy" data-zh="复制">Copy</span>
        </button>
      </div>

      <a href="{{SHARE_URL}}" class="btn-primary" id="openBtn" target="_blank" rel="noopener noreferrer"
         data-en="Connect to Signal"
         data-zh="一键连接 Signal">
        Connect to Signal
      </a>

      <div class="info">
        <div>
          <span class="info-label" id="guideLabel" data-en="Signal Setup:" data-zh="Signal 配置：">Signal Setup:</span>
          <span id="guideText"
                data-en="In Signal App, go to Settings &gt; Data and storage &gt; Use proxy."
                data-zh="在 Signal 中打开 设置 &gt; 数据与存储 &gt; 使用代理。">
            In Signal App, go to Settings &gt; Data and storage &gt; Use proxy.
          </span>
        </div>
        <div class="meta-row">
          <span class="mono-meta">{{HOST}}:443</span>
          <span class="status-indicator">
            <span class="status-dot" aria-hidden="true"></span>
            <span id="activeLabel" data-en="Active Sessions:" data-zh="活跃会话：">Active Sessions:</span>
            <strong id="activeCount">{{ACTIVE_CONNECTIONS}}</strong>
          </span>
        </div>
      </div>
    </div>
  </main>

  <footer>
    <a href="https://github.com/Obein/Sinel" target="_blank" rel="noopener noreferrer" class="footer-link">github.com/Obein/Sinel</a>
    <span>{{HOST}}</span>
  </footer>

  <script src="app.js"></script>
</body>
</html>
