<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sinel: A Signal TLS Proxy - {{HOST}}</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🖇️</text></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <nav class="lang-switch" aria-label="Language Switcher">
      <button id="btn-en" type="button" onclick="setLanguage('en')">EN</button>
      <span class="divider">/</span>
      <button id="btn-zh" type="button" class="active" onclick="setLanguage('zh')">中文</button>
    </nav>
  </header>

  <main>
    <div class="title-group">
      <h1>Sinel: A Signal TLS Proxy</h1>
      <p class="subtitle" id="subtitle"
         data-en="End-to-end encrypted relay for Signal censorship circumvention."
         data-zh="端到端加密的 Signal 抗审查专属代理通道。">
        端到端加密的 Signal 抗审查专属代理通道。
      </p>
    </div>

    <div class="card">
      <div class="input-wrap">
        <input type="text" id="shareUrl" value="{{SHARE_URL}}" readonly spellcheck="false">
        <button class="btn-copy" id="copyBtn" type="button" onclick="copyProxyUrl()">
          <span id="copyBtnText" data-en="Copy" data-zh="复制">复制</span>
        </button>
      </div>

      <a href="{{SHARE_URL}}" class="btn-primary" id="openBtn" target="_blank" rel="noopener noreferrer"
         data-en="Connect to Signal"
         data-zh="一键连接 Signal">
        一键连接 Signal
      </a>

      <div class="info">
        <div>
          <span class="info-label" id="guideLabel" data-en="Manual Setup:" data-zh="手动配置：">手动配置：</span>
          <span id="guideText"
                data-en="In Signal App, go to Settings &gt; Data and storage &gt; Use proxy."
                data-zh="在 Signal 中打开 设置 &gt; 数据与存储 &gt; 使用代理。">
            在 Signal 中打开 设置 &gt; 数据与存储 &gt; 使用代理。
          </span>
        </div>
        <div>
          <span class="mono-meta">{{HOST}}:443</span>
        </div>
      </div>
    </div>
  </main>

  <footer>
    <span>Sinel</span>
    <span>{{HOST}}</span>
  </footer>

  <script src="app.js"></script>
</body>
</html>
